name: REMNIS Culinary Batch 7 Builder

on:
  push:
    branches: [remnis-culinary-builder]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cuisine-packs:
    runs-on: ubuntu-latest
    steps:
      - name: Build France Spain India Mexico UK USA Turkey packs
        shell: python
        run: |
          import hashlib, json, re, unicodedata, urllib.request, uuid
          from pathlib import Path

          BASE = 'https://raw.githubusercontent.com/AdamBouhmad/open-recipe-archive/main/collections'
          cuisines = [
              ('fr','france','cuisine-francaise'),
              ('es','spain','cocina-espanola'),
              ('in','india','indian-kitchen'),
              ('mx','mexico','cocina-mexicana'),
              ('gb','united-kingdom','victorian-britain'),
              ('us','american-historical','ye-old-american'),
              ('tr','turkey','ottoman-turkish'),
          ]
          allowed = {'public-domain', 'cc0', 'unlicense'}
          cross_refs = (
              re.compile(r'\b(?:as|like|according to|same as)\s+(?:recipe\s+)?(?:no\.?|number)\s*\d+\b', re.I),
              re.compile(r'\b(?:see|refer to|prepare as|made as)\s+(?:recipe\s+)?(?:no\.?|number)?\s*\d+\b', re.I),
              re.compile(r'\brecipe\s+(?:n\.?|no\.?|number)\s*\d+\b', re.I),
          )
          homoglyphs = str.maketrans({'а':'a','е':'e','о':'o','р':'p','с':'c','х':'x','у':'y'})

          def canonical(v):
              v = str(v).translate(homoglyphs)
              v = unicodedata.normalize('NFKD', v)
              v = ''.join(ch for ch in v if not unicodedata.combining(ch))
              return re.sub(r'[^a-z0-9]+', ' ', v.casefold()).strip()

          def sections(body):
              ing, steps, mode = [], [], None
              for raw in body.splitlines():
                  line = raw.strip()
                  if not line: continue
                  low = line.casefold().strip('#: ')
                  if low.startswith(('ingredient','materials')):
                      mode='ingredients'; continue
                  if low.startswith(('direction','instruction','method','preparation','procedure')):
                      mode='steps'; continue
                  text = re.sub(r'^[-*]\s*', '', line)
                  text = re.sub(r'^\d+[.)]\s*', '', text)
                  if line.startswith('#'): continue
                  if mode == 'ingredients': ing.append(text)
                  elif mode == 'steps': steps.append(text)
              return ing, steps

          def has_crossref(lines):
              text = ' '.join(lines)
              return any(p.search(text) for p in cross_refs)

          def fingerprint(ing, steps):
              payload = '|'.join(canonical(x) for x in ing + steps if canonical(x))
              return hashlib.sha1(payload.encode()).hexdigest()

          Path('out').mkdir()
          summary = []
          failures = []

          for country_id, culture, collection in cuisines:
              source_url = f'{BASE}/{collection}/recipes.jsonl'
              source_path = Path(f'{country_id}-source.jsonl')
              print(f'Downloading {collection} ...')
              urllib.request.urlretrieve(source_url, source_path)

              raw=licensed=structured=0
              rejected={'invalid_json':0,'wrong_culture':0,'license':0,'incomplete':0,'cross_reference':0,'duplicate':0}
              recipes=[]; seen_names=set(); seen_content=set()
              with source_path.open(encoding='utf-8') as f:
                  for line in f:
                      if not line.strip(): continue
                      raw += 1
                      try: obj=json.loads(line)
                      except Exception:
                          rejected['invalid_json'] += 1; continue
                      if str(obj.get('culture','')).casefold() != culture.casefold():
                          rejected['wrong_culture'] += 1; continue
                      if str(obj.get('license','')).casefold() not in allowed:
                          rejected['license'] += 1; continue
                      licensed += 1
                      title=str(obj.get('title','')).strip(); body=str(obj.get('body',''))
                      ing,steps=sections(body)
                      if not title or not ing or not steps:
                          rejected['incomplete'] += 1; continue
                      if has_crossref(ing+steps):
                          rejected['cross_reference'] += 1; continue
                      structured += 1
                      name_key=canonical(title); fp=fingerprint(ing,steps)
                      if name_key in seen_names or fp in seen_content:
                          rejected['duplicate'] += 1; continue
                      seen_names.add(name_key); seen_content.add(fp)
                      source_url_item=str(obj.get('source_url',''))
                      slug=re.sub(r'[^a-z0-9]+','-',canonical(title)).strip('-')[:70] or 'recipe'
                      rid=f"{country_id}-{slug}-{hashlib.sha1((title+'|'+source_url_item).encode()).hexdigest()[:9]}"
                      ingredients=[{
                          'id': str(uuid.uuid5(uuid.NAMESPACE_URL,'remnis-ingredient:'+x)),
                          'name': x, 'amount': 0.0, 'unit': '', 'note': None
                      } for x in ing]
                      recipes.append({
                          'id':rid,'countryID':country_id,'name':title,'mealType':'main',
                          'description':f"From {obj.get('source_title') or 'a public-domain cookbook'}.",
                          'baseServings':0,'prepMinutes':0,'cookMinutes':0,
                          'ingredients':ingredients,'steps':steps,
                          'tags':[country_id,'bundled','source-grounded'],
                          'provenance':{
                              'collection':obj.get('collection'),'culture':obj.get('culture'),
                              'author':obj.get('author'),'sourceTitle':obj.get('source_title'),
                              'sourceURL':source_url_item,'sourceYear':obj.get('source_year'),'license':obj.get('license')
                          }
                      })

              selected=recipes[:350]
              status='PASS' if len(selected) >= 300 else 'FAIL'
              if status == 'FAIL': failures.append(country_id)
              envelope={'schemaVersion':1,'countryID':country_id,'recipes':selected}
              out=Path('out')/f'CulinaryRecipes-{country_id}.json'
              out.write_text(json.dumps(envelope,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              digest=hashlib.sha256(out.read_bytes()).hexdigest()
              (Path('out')/f'CulinaryRecipes-{country_id}.json.sha256').write_text(digest+f'  CulinaryRecipes-{country_id}.json\n')
              report={
                  'countryID':country_id,'culture':culture,'collection':collection,'sourceURL':source_url,
                  'rawRows':raw,'licensedRows':licensed,'structurallyCompleteRows':structured,
                  'uniqueStandaloneRows':len(recipes),'shippedRows':len(selected),'minimumRequired':300,
                  'status':status,'sha256':digest,'rejected':rejected
              }
              (Path('out')/f'{country_id}-production-report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
              summary.append(report)
              print(f'{country_id.upper()} {status}: {len(selected)} shipped from {len(recipes)} unique standalone candidates')

          Path('out/batch-production-summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          if failures:
              raise SystemExit('Minimum 300-recipe gate failed for: '+', '.join(failures))

      - name: Upload batch production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remnis-culinary-batch-7
          path: out/
          if-no-files-found: error
          compression-level: 9
