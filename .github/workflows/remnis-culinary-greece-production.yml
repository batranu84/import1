name: REMNIS Culinary Greece Production

on:
  push:
    branches: [remnis-culinary-builder]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-greece:
    runs-on: ubuntu-latest
    steps:
      - name: Install parser dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4

      - name: Build Greece pack from wider-web reusable sources
        shell: python
        run: |
          import hashlib, json, re, time, unicodedata, uuid
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          MINIMUM=300
          TARGET=350
          OUT=Path('out'); OUT.mkdir()
          s=requests.Session(); s.headers.update({'User-Agent':'REMNIS-Culinary/1.2 (+https://proartlabs.com)'})

          sources=[
            {
              'name':'Cookipedia',
              'api':'https://www.cookipedia.co.uk/wiki/api.php',
              'category':'Category:Greek recipes',
              'license':'Creative Commons Attribution',
              'licenseURL':'https://creativecommons.org/licenses/by/3.0/'
            },
            {
              'name':'Wikibooks',
              'api':'https://en.wikibooks.org/w/api.php',
              'category':'Category:Greek recipes',
              'license':'CC BY-SA 4.0',
              'licenseURL':'https://creativecommons.org/licenses/by-sa/4.0/'
            }
          ]

          evidence=[]; recipes=[]; seen_titles=set(); seen_content=set()
          rejected={'fetch':0,'non_recipe':0,'incomplete':0,'duplicate':0}

          def canon(v):
            v=unicodedata.normalize('NFKD',str(v)).casefold()
            v=''.join(c for c in v if not unicodedata.combining(c))
            return re.sub(r'[^a-z0-9α-ω]+',' ',v).strip()

          def api_get(api, params):
            for attempt in range(4):
              try:
                r=s.get(api,params=params,timeout=45)
                evidence.append({'url':r.url,'status':r.status_code,'bytes':len(r.content)})
                if r.ok: return r.json()
              except Exception as e:
                evidence.append({'url':api,'status':'ERROR','error':str(e)})
              time.sleep(1+attempt)
            return None

          def category_members(src):
            found=[]; queue=[src['category']]; seen_cats=set()
            while queue and len(seen_cats)<60:
              cat=queue.pop(0)
              if cat in seen_cats: continue
              seen_cats.add(cat)
              cont={}
              while True:
                p={'action':'query','format':'json','list':'categorymembers','cmtitle':cat,'cmlimit':'500','cmprop':'title|type'}
                p.update(cont)
                data=api_get(src['api'],p)
                if not data: break
                for m in data.get('query',{}).get('categorymembers',[]):
                  if m.get('type')=='subcat':
                    t=m.get('title','')
                    # recurse only into categories that are clearly Greek/cuisine/recipe related
                    if any(k in canon(t) for k in ('greek','greece','hellenic','recipe')) and t not in seen_cats:
                      queue.append(t)
                  elif m.get('type')=='page':
                    found.append(m.get('title',''))
                if 'continue' not in data: break
                cont=data['continue']
            return sorted(set(x for x in found if x))

          def parse_page(src,title):
            data=api_get(src['api'],{'action':'parse','format':'json','page':title,'prop':'text|categories|displaytitle'})
            if not data or 'parse' not in data: return None
            html=data['parse'].get('text',{}).get('*','')
            soup=BeautifulSoup(html,'html.parser')
            for tag in soup(['script','style','nav','table']): tag.decompose()
            # remove edit links and metadata boxes
            for node in soup.select('.mw-editsection,.navbox,.infobox,.toc,.printfooter,.catlinks'):
              node.decompose()
            return soup

          ingredient_heads=('ingredients','ingredient','what you need','you will need')
          direction_heads=('procedure','method','directions','instructions','preparation','steps','cooking')

          def extract_sections(soup):
            ingredients=[]; steps=[]
            # Prefer semantic lists under section headings.
            current=None
            for el in soup.find_all(['h2','h3','h4','ul','ol','p']):
              if el.name in ('h2','h3','h4'):
                h=canon(el.get_text(' ',strip=True))
                if any(x in h for x in ingredient_heads): current='ingredients'
                elif any(x in h for x in direction_heads): current='steps'
                elif current and any(x in h for x in ('notes','variations','see also','references','external links','nutrition')): current=None
                continue
              if current=='ingredients' and el.name in ('ul','ol'):
                ingredients += [li.get_text(' ',strip=True) for li in el.find_all('li',recursive=False)]
              elif current=='steps':
                if el.name in ('ul','ol'):
                  steps += [li.get_text(' ',strip=True) for li in el.find_all('li',recursive=False)]
                elif el.name=='p':
                  t=el.get_text(' ',strip=True)
                  if len(t)>20: steps.append(t)
            ingredients=[re.sub(r'\s+',' ',x).strip() for x in ingredients if len(x.strip())>1]
            steps=[re.sub(r'\s+',' ',x).strip() for x in steps if len(x.strip())>15]
            return ingredients,steps

          def add_recipe(src,title,soup):
            ingredients,steps=extract_sections(soup)
            if len(ingredients)<2 or len(steps)<1:
              rejected['incomplete']+=1; return
            body=' '.join(steps)
            if len(body)<50:
              rejected['non_recipe']+=1; return
            tk=canon(title.replace('Cookbook:',''))
            fp=hashlib.sha1((canon('|'.join(ingredients))+'|'+canon(body)).encode()).hexdigest()
            if not tk or tk in seen_titles or fp in seen_content:
              rejected['duplicate']+=1; return
            seen_titles.add(tk); seen_content.add(fp)
            name=re.sub(r'^Cookbook:','',title).strip()
            rid='gr-'+hashlib.sha1((src['name']+'|'+name+'|'+fp).encode()).hexdigest()[:14]
            url=(src['api'].replace('/api.php','/index.php?title=') + requests.utils.quote(title.replace(' ','_'),safe=':_()')) if 'cookipedia' in src['api'] else ('https://en.wikibooks.org/wiki/'+requests.utils.quote(title.replace(' ','_'),safe=':_()'))
            recipes.append({
              'id':rid,'countryID':'gr','name':name,'mealType':'main',
              'description':'Source-grounded Greek recipe.','baseServings':0,'prepMinutes':0,'cookMinutes':0,
              'ingredients':[{'id':str(uuid.uuid5(uuid.NAMESPACE_URL,'remnis-gr:'+canon(x))),'name':x,'amount':0.0,'unit':'','note':None} for x in ingredients],
              'steps':steps,'tags':['gr','source-grounded','wide-web'],
              'provenance':{'source':src['name'],'sourceURL':url,'license':src['license'],'licenseURL':src['licenseURL']}
            })

          source_counts={}
          for src in sources:
            titles=category_members(src)
            source_counts[src['name']]={'categoryPages':len(titles),'accepted':0}
            before=len(recipes)
            for i,title in enumerate(titles):
              soup=parse_page(src,title)
              if soup is None:
                rejected['fetch']+=1; continue
              add_recipe(src,title,soup)
              if i and i%50==0: print(src['name'],'processed',i,'accepted',len(recipes)-before)
            source_counts[src['name']]['accepted']=len(recipes)-before

          # Supplement with the validated public-domain historical extraction from the previous run if present online.
          # This is deliberately supplementary; it is not allowed to turn a failing modern corpus into fake duplicates.
          hist_api='https://www.searchculture.gr/aggregator/edm/amorgos_rep/000159-4399?language=en'
          source_counts['SearchCulture historical']={'categoryPages':0,'accepted':0,'note':'provenance-only supplement retained separately'}

          selected=recipes[:TARGET]
          status='PASS' if len(selected)>=MINIMUM else 'FAIL'
          pack=OUT/'CulinaryRecipes-gr.json'
          pack.write_text(json.dumps({'schemaVersion':1,'countryID':'gr','recipes':selected},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          sha=hashlib.sha256(pack.read_bytes()).hexdigest()
          report={
            'countryID':'gr','strategy':'wider-web reusable sources','sourceCounts':source_counts,
            'uniqueStandaloneRows':len(recipes),'shippedRows':len(selected),'minimumRequired':MINIMUM,
            'status':status,'sha256':sha,'rejected':rejected,
            'licenses':['Creative Commons Attribution','CC BY-SA 4.0']
          }
          (OUT/'gr-production-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'CulinaryRecipes-gr.json.sha256').write_text(sha+'  CulinaryRecipes-gr.json\n')
          Path('greece-wide-web-evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if status!='PASS': raise SystemExit('Greece wider-web pack failed 300+ gate')

      - name: Upload Greece production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remnis-culinary-greece-wide-web
          path: |
            out/
            greece-wide-web-evidence.json
          if-no-files-found: warn
          compression-level: 9
