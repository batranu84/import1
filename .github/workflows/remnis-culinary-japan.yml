name: REMNIS Culinary Japan Source Build

on:
  push:
    branches: [remnis-culinary-build119]
    paths: [.github/workflows/remnis-culinary-japan.yml]
  workflow_dispatch:

jobs:
  japan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire Japan workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source
          curl -L --fail --retry 3 -o out/source/Asia_recipes_processed_ali.xlsx https://raw.githubusercontent.com/LiqiaoHuang/Asia_recipe_data/main/Asia_recipes_processed_ali.xlsx
          python -m pip install --quiet openpyxl
      - name: Inspect workbook schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from openpyxl import load_workbook
          p='out/source/Asia_recipes_processed_ali.xlsx'
          wb=load_workbook(p,read_only=True,data_only=True)
          report={'sheets':[]}
          for ws in wb.worksheets:
              rows=[]
              for i,row in enumerate(ws.iter_rows(values_only=True),start=1):
                  rows.append([None if x is None else str(x)[:300] for x in row])
                  if i>=8:break
              report['sheets'].append({'title':ws.title,'max_row':ws.max_row,'max_column':ws.max_column,'first_rows':rows})
          with open('out/JAPAN_WORKBOOK_SCHEMA.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload Japan diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: remnis-japan-schema-build119
          path: out/
          retention-days: 7
