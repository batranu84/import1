name: REMNIS Culinary Japan Production Source Audit

on:
  push:
    branches: [remnis-culinary-build119]
    paths: [.github/workflows/remnis-culinary-japan.yml]
  workflow_dispatch:

jobs:
  japan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire licensed Japan sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source out/audit
          git clone --depth 1 https://github.com/AdamBouhmad/open-recipe-archive.git open-recipe-archive
          git clone --depth 1 https://github.com/futurechef/forkrecipe-recipes.git forkrecipe-recipes
          python -m pip install --quiet requests beautifulsoup4

      - name: Audit source capacity and provenance
        shell: bash
        run: |
          cat > /tmp/japan_audit.py <<'PY'
          import json,re,pathlib,unicodedata
          import requests

          out=pathlib.Path('out')
          report={'countryID':'jp','minimumRequired':300,'policy':'Only source-grounded recipes from public-domain or explicit commercial-compatible Creative Commons sources. No relabelling of other cuisines and no synthetic recipe variants.'}
          s=requests.Session(); s.headers['User-Agent']='REMNIS-One-source-audit/1.0 (+https://proartlabs.com/remnis-one/)'
          def canon(v):
            v=unicodedata.normalize('NFKC',str(v or '')).casefold()
            return re.sub(r'[^0-9a-z\u3040-\u30ff\u3400-\u9fff]+','',v)

          # Scan every Open Recipe Archive collection, not only japanese-kitchen.
          ora=[]; seen=set(); by_collection={}
          for p in pathlib.Path('open-recipe-archive/collections').glob('*/recipes.jsonl'):
            local=0
            for line in p.read_text(encoding='utf-8',errors='ignore').splitlines():
              try:r=json.loads(line)
              except:continue
              if str(r.get('culture','')).casefold()!='japan':continue
              if str(r.get('license','')).casefold() not in {'public-domain','public domain','cc0','unlicense'}:continue
              k=canon(r.get('title'))
              if not k or k in seen:continue
              seen.add(k); ora.append(r); local+=1
            if local:by_collection[p.parent.name]=local
          report['openRecipeArchive']={'usableDistinctRows':len(ora),'license':'public-domain/CC0/Unlicense','collections':by_collection,'source':'AdamBouhmad/open-recipe-archive all collections'}
          with (out/'source/open-recipe-archive-japan-all.jsonl').open('w',encoding='utf-8') as f:
            for r in ora:f.write(json.dumps(r,ensure_ascii=False)+'\n')

          fr=[]; seen_fr=set()
          for p in pathlib.Path('forkrecipe-recipes/recipes').glob('*.js'):
            t=p.read_text(encoding='utf-8',errors='ignore')
            cuisine=re.search(r'\bcuisine:\s*["\']([^"\']+)["\']',t)
            culture=re.search(r'\bculture:\s*["\']([^"\']+)["\']',t)
            lic=re.search(r'\blicense:\s*["\']([^"\']+)["\']',t)
            title=re.search(r'\btitle:\s*["\']([^"\']+)["\']',t)
            is_jp=(cuisine and 'japan' in cuisine.group(1).casefold()) or (culture and 'japan' in culture.group(1).casefold())
            if not (is_jp and lic and 'cc-by-sa' in lic.group(1).casefold()):continue
            k=canon(title.group(1) if title else p.stem)
            if not k or k in seen_fr:continue
            seen_fr.add(k)
            fr.append({'path':str(p.relative_to('forkrecipe-recipes')),'title':title.group(1) if title else p.stem,'cuisine':cuisine.group(1) if cuisine else None,'culture':culture.group(1) if culture else None,'license':lic.group(1)})
          report['forkRecipe']={'usableDistinctRows':len(fr),'license':'CC BY-SA','source':'futurechef/forkrecipe-recipes'}
          (out/'source/forkrecipe-japan-index.json').write_text(json.dumps(fr,ensure_ascii=False,indent=2),encoding='utf-8')

          api='https://en.wikibooks.org/w/api.php'; cm=[]; cont={}
          while True:
            params={'action':'query','format':'json','list':'categorymembers','cmtitle':'Category:Japanese recipes','cmlimit':'500','cmnamespace':'102'}; params.update(cont)
            data=s.get(api,params=params,timeout=30).json(); cm.extend(data.get('query',{}).get('categorymembers',[]))
            if 'continue' not in data:break
            cont=data['continue']
          cm_unique=[]; seen_w=set()
          for x in cm:
            k=canon(x.get('title'))
            if not k or k in seen_w:continue
            seen_w.add(k); cm_unique.append(x)
          report['wikibooks']={'categoryDistinctRows':len(cm_unique),'license':'CC BY-SA','source':'Wikibooks Category:Japanese recipes'}
          (out/'source/wikibooks-japanese-index.json').write_text(json.dumps(cm_unique,ensure_ascii=False,indent=2),encoding='utf-8')

          # Cross-source title dedupe for conservative capacity.
          merged={}
          for r in ora: merged.setdefault(canon(r.get('title')),('ora',r.get('title')))
          for r in fr: merged.setdefault(canon(r.get('title')),('forkrecipe',r.get('title')))
          for r in cm_unique: merged.setdefault(canon(r.get('title')),('wikibooks',r.get('title')))
          report['crossSourceDistinctLicensedCapacity']=len(merged)
          report['remainingTo300']=max(0,300-len(merged))
          report['status']='PASS_CAPACITY' if len(merged)>=300 else 'NEEDS_MORE_LICENSED_SOURCES'
          (out/'JAPAN_SOURCE_CAPACITY_AUDIT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/japan_audit.py
          (cd out && sha256sum source/* JAPAN_SOURCE_CAPACITY_AUDIT.json > audit/SHA256SUMS.txt)

      - name: Upload Japan capacity audit
        uses: actions/upload-artifact@v4
        with:
          name: remnis-japan-capacity-audit-build121c
          path: out/
          retention-days: 7
