name: REMNIS Culinary Japan Production Source Audit

on:
  push:
    branches: [remnis-culinary-build119]
    paths: [.github/workflows/remnis-culinary-japan.yml]
  workflow_dispatch:

jobs:
  japan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acquire licensed Japan sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source out/audit
          git clone --depth 1 https://github.com/AdamBouhmad/open-recipe-archive.git open-recipe-archive
          git clone --depth 1 https://github.com/futurechef/forkrecipe-recipes.git forkrecipe-recipes
          python -m pip install --quiet requests beautifulsoup4

      - name: Audit source capacity and provenance
        shell: bash
        run: |
          cat > /tmp/japan_audit.py <<'PY'
          import json,re,pathlib,time
          import requests
          from bs4 import BeautifulSoup

          out=pathlib.Path('out')
          report={
            'countryID':'jp',
            'minimumRequired':300,
            'policy':'Only source-grounded recipes from public-domain or explicit commercial-compatible Creative Commons sources. No relabelling of other cuisines and no synthetic recipe variants.'
          }
          s=requests.Session(); s.headers['User-Agent']='REMNIS-One-source-audit/1.0 (+https://proartlabs.com/remnis-one/)'

          ora=pathlib.Path('open-recipe-archive/collections/japanese-kitchen/recipes.jsonl')
          ora_rows=[]
          if ora.exists():
            for line in ora.read_text(encoding='utf-8').splitlines():
              try:r=json.loads(line)
              except:continue
              if str(r.get('culture','')).casefold()=='japan' and str(r.get('license','')).casefold() in {'public-domain','public domain','cc0','unlicense'}:
                ora_rows.append(r)
          report['openRecipeArchive']={'usableRows':len(ora_rows),'license':'public-domain','source':'AdamBouhmad/open-recipe-archive japanese-kitchen'}
          with (out/'source/open-recipe-archive-japan.jsonl').open('w',encoding='utf-8') as f:
            for r in ora_rows:f.write(json.dumps(r,ensure_ascii=False)+'\n')

          fr=[]
          for p in pathlib.Path('forkrecipe-recipes/recipes').glob('*.js'):
            t=p.read_text(encoding='utf-8',errors='ignore')
            cuisine=re.search(r'\bcuisine:\s*["\']([^"\']+)["\']',t)
            culture=re.search(r'\bculture:\s*["\']([^"\']+)["\']',t)
            lic=re.search(r'\blicense:\s*["\']([^"\']+)["\']',t)
            is_jp=(cuisine and 'japan' in cuisine.group(1).casefold()) or (culture and 'japan' in culture.group(1).casefold())
            if is_jp and lic and 'cc-by-sa' in lic.group(1).casefold():
              fr.append({'path':str(p.relative_to('forkrecipe-recipes')),'cuisine':cuisine.group(1) if cuisine else None,'culture':culture.group(1) if culture else None,'license':lic.group(1)})
          report['forkRecipe']={'usableRows':len(fr),'license':'CC BY-SA','source':'futurechef/forkrecipe-recipes'}
          (out/'source/forkrecipe-japan-index.json').write_text(json.dumps(fr,ensure_ascii=False,indent=2),encoding='utf-8')

          api='https://en.wikibooks.org/w/api.php'
          cm=[]; cont={}
          while True:
            params={'action':'query','format':'json','list':'categorymembers','cmtitle':'Category:Japanese recipes','cmlimit':'500','cmnamespace':'102'}
            params.update(cont)
            data=s.get(api,params=params,timeout=30).json(); cm.extend(data.get('query',{}).get('categorymembers',[]))
            if 'continue' not in data:break
            cont=data['continue']
          report['wikibooks']={'categoryRows':len(cm),'license':'CC BY-SA','source':'Wikibooks Category:Japanese recipes'}
          (out/'source/wikibooks-japanese-index.json').write_text(json.dumps(cm,ensure_ascii=False,indent=2),encoding='utf-8')

          # Public Japanese recipe translations at jaygerbrandt.com/tofu/.
          # This audit does not assume rights from title alone: it records only pages that
          # explicitly expose a Creative Commons attribution/share-alike notice in page text.
          tofu=[]
          base='https://jaygerbrandt.com/tofu/'
          try:
            home=s.get(base,timeout=30); home.raise_for_status(); soup=BeautifulSoup(home.text,'html.parser')
            links=[]
            for a in soup.find_all('a',href=True):
              href=a['href']
              if href.startswith('/'):
                href='https://jaygerbrandt.com'+href
              elif href.startswith('./'):
                href=base+href[2:]
              elif not href.startswith('http'):
                href=base+href
              if 'jaygerbrandt.com/tofu/' in href and href.rstrip('/')!=base.rstrip('/'):
                links.append(href.split('#')[0])
            links=sorted(set(links))
            for url in links:
              try:
                r=s.get(url,timeout=20); r.raise_for_status(); ps=BeautifulSoup(r.text,'html.parser'); txt=ps.get_text('\n',strip=True)
              except:continue
              low=txt.casefold()
              licensed=('creative commons' in low and ('sharealike' in low or 'cc by-sa' in low or 'attribution-sharealike' in low))
              # recipe-like: a numbered heading/title plus preparation prose
              h=(ps.find('h1') or ps.find('h2'))
              if licensed and h and len(txt)>250:
                tofu.append({'url':url,'title':h.get_text(' ',strip=True),'licenseEvidence':'Creative Commons attribution/share-alike notice present'})
              time.sleep(.03)
          except Exception as e:
            report['tofuHyakuchinError']=str(e)[:200]
          report['tofuHyakuchinWeb']={'licensedRecipePages':len(tofu),'source':'jaygerbrandt.com/tofu/'}
          (out/'source/tofu-hyakuchin-index.json').write_text(json.dumps(tofu,ensure_ascii=False,indent=2),encoding='utf-8')

          conservative=len(ora_rows)+len(fr)+len(cm)+len(tofu)
          report['conservativeLicensedCapacity']=conservative
          report['status']='PASS_CAPACITY' if conservative>=300 else 'NEEDS_MORE_LICENSED_SOURCES'
          (out/'JAPAN_SOURCE_CAPACITY_AUDIT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/japan_audit.py
          (cd out && sha256sum source/* JAPAN_SOURCE_CAPACITY_AUDIT.json > audit/SHA256SUMS.txt)

      - name: Upload Japan capacity audit
        uses: actions/upload-artifact@v4
        with:
          name: remnis-japan-capacity-audit-build121b
          path: out/
          retention-days: 7
