name: REMNIS Culinary Japan Production Pack

on:
  push:
    branches: [remnis-culinary-build119]
    paths: [.github/workflows/remnis-culinary-japan.yml]
  workflow_dispatch:

jobs:
  japan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Acquire licensed Japan sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source out/normalized out/audit
          git clone --depth 1 https://github.com/AdamBouhmad/open-recipe-archive.git open-recipe-archive
          git clone --depth 1 https://github.com/futurechef/forkrecipe-recipes.git forkrecipe-recipes
          python -m pip install --quiet requests beautifulsoup4

      - name: Normalize Japan production candidates
        shell: bash
        run: |
          cat > /tmp/japan_pack.py <<'PY'
          import json,re,pathlib,unicodedata,uuid,hashlib
          import requests
          from bs4 import BeautifulSoup

          out=pathlib.Path('out'); MIN=200
          s=requests.Session(); s.headers['User-Agent']='REMNIS-One-source-audit/1.0 (+https://proartlabs.com/remnis-one/)'
          def clean(x): return re.sub(r'\s+',' ',str(x or '')).strip()
          def canon(x):
            x=unicodedata.normalize('NFKC',clean(x).casefold())
            return re.sub(r'[^0-9a-z\u3040-\u30ff\u3400-\u9fff]+','',x)
          unit_alias={'g':'g','gram':'g','grams':'g','kg':'kg','ml':'ml','l':'l','cup':'cup','cups':'cup','tbsp':'tbsp','tablespoon':'tbsp','tablespoons':'tbsp','tsp':'tsp','teaspoon':'tsp','teaspoons':'tsp','oz':'oz','ounce':'oz','ounces':'oz','lb':'lb','lbs':'lb','pound':'lb','pounds':'lb','clove':'clove','cloves':'clove','piece':'piece','pieces':'piece','slice':'slice','slices':'slice','egg':'piece','eggs':'piece','part':'part','parts':'part'}
          frac={'1/2':.5,'1/3':1/3,'2/3':2/3,'1/4':.25,'3/4':.75,'1/8':.125,'3/8':.375,'5/8':.625,'7/8':.875,'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75}
          qty_re=re.compile(r'^\s*(?P<n>\d+\s+\d+/\d+|\d+/\d+|\d+(?:\.\d+)?|[½⅓⅔¼¾])\s*(?P<u>grams?|g|kg|ml|l|cups?|tbsp|tablespoons?|tsp|teaspoons?|oz|ounces?|lb|lbs|pounds?|cloves?|pieces?|slices?|eggs?|parts?)\b\s*(?:of\s+)?(?P<name>.+)$',re.I)
          def num(x):
            x=x.strip()
            if x in frac:return frac[x]
            if ' ' in x and '/' in x:
              a,b=x.split(' ',1);p,q=b.split('/');return float(a)+float(p)/float(q)
            if '/' in x:
              p,q=x.split('/');return float(p)/float(q)
            return float(x)
          def ingredient(line):
            raw=clean(re.sub(r'^[-*•]\s*','',line));m=qty_re.match(raw)
            if not m:return {'id':str(uuid.uuid5(uuid.NAMESPACE_URL,'jp:'+raw)),'name':raw,'amount':0.0,'unit':'','note':raw}
            return {'id':str(uuid.uuid5(uuid.NAMESPACE_URL,'jp:'+raw)),'name':clean(m.group('name')),'amount':num(m.group('n')),'unit':unit_alias.get(m.group('u').casefold(),m.group('u').casefold()),'note':raw}
          def sections(body):
            ing=[];steps=[];mode=None
            for raw in body.splitlines():
              line=raw.strip()
              if not line:continue
              low=line.casefold().strip('#: ')
              if low.startswith(('ingredient','materials')):mode='i';continue
              if low.startswith(('direction','instruction','method','preparation','procedure')):mode='s';continue
              if line.startswith('#'):continue
              text=re.sub(r'^[-*]\s*','',line);text=re.sub(r'^\d+[.)]\s*','',text)
              if mode=='i':ing.append(text)
              elif mode=='s':steps.append(text)
            return ing,steps
          def meal(title):
            t=title.casefold()
            if any(x in t for x in ['soup','broth']):return 'soup'
            if any(x in t for x in ['rice','donburi']):return 'rice'
            if any(x in t for x in ['noodle','soba','udon','ramen']):return 'noodles'
            if any(x in t for x in ['cake','sweet','dessert','mochi']):return 'dessert'
            return 'main'
          rows=[];seen=set();stats={}
          def add(title,ings,steps,source,url,license_,source_year=None,description=None):
            title=clean(title);ings=[clean(x) for x in ings if clean(x)];steps=[clean(x) for x in steps if len(clean(x))>=8]
            # Current release policy is 200+ genuine source-backed recipes. Missing
            # numeric amounts are preserved as source text rather than fabricated.
            if not title or len(ings)<3 or len(steps)<2:return False
            k=canon(title)
            if not k or k in seen:return False
            seen.add(k);parsed=[ingredient(x) for x in ings]
            rid='jp-'+(re.sub(r'[^a-z0-9]+','-',unicodedata.normalize('NFKD',title).encode('ascii','ignore').decode().casefold()).strip('-')[:64] or 'recipe')+'-'+hashlib.sha1((title+'|'+url).encode()).hexdigest()[:8]
            rows.append({'id':rid,'countryID':'jp','name':title,'mealType':meal(title),'description':clean(description) or f'Source-grounded Japanese recipe from {source}.','baseServings':4,'prepMinutes':10,'cookMinutes':25,'ingredients':parsed,'steps':steps,'tags':['jp','bundled','source-grounded','servings-estimated','time-estimated'],'provenance':{'sourceTitle':source,'sourceURL':url,'sourceYear':source_year,'license':license_}});return True

          ora_raw=ora_ok=0
          for p in pathlib.Path('open-recipe-archive/collections').glob('*/recipes.jsonl'):
            for line in p.read_text(encoding='utf-8',errors='ignore').splitlines():
              try:r=json.loads(line)
              except:continue
              if str(r.get('culture','')).casefold()!='japan':continue
              if str(r.get('license','')).casefold() not in {'public-domain','public domain','cc0','unlicense'}:continue
              ora_raw+=1;ing,steps=sections(str(r.get('body','')))
              if add(r.get('title'),ing,steps,r.get('source_title') or p.parent.name,r.get('source_url') or 'https://github.com/AdamBouhmad/open-recipe-archive',r.get('license'),r.get('source_year')):ora_ok+=1
          stats['openRecipeArchiveRaw']=ora_raw;stats['openRecipeArchiveAccepted']=ora_ok

          fr_raw=fr_ok=0
          for p in pathlib.Path('forkrecipe-recipes/recipes').glob('*.js'):
            t=p.read_text(encoding='utf-8',errors='ignore')
            cuisine=re.search(r'\bcuisine:\s*["\']([^"\']+)["\']',t);culture=re.search(r'\bculture:\s*["\']([^"\']+)["\']',t);lic=re.search(r'\blicense:\s*["\']([^"\']+)["\']',t);title=re.search(r'\btitle:\s*["\']([^"\']+)["\']',t);desc=re.search(r'\bdescription:\s*["\']([^"\']+)["\']',t)
            is_jp=(cuisine and 'japan' in cuisine.group(1).casefold()) or (culture and 'japan' in culture.group(1).casefold())
            if not (is_jp and lic and 'cc-by-sa' in lic.group(1).casefold() and title):continue
            fr_raw+=1;ings=[]
            for block in re.findall(r'\{[^{}]{0,800}\}',t,re.S):
              nm=re.search(r'\bname:\s*["\']([^"\']+)["\']',block);rv=re.search(r'\bratioValue:\s*([0-9.]+)',block);du=re.search(r'\bdefaultUnit:\s*["\']([^"\']+)["\']',block)
              if nm and rv and du:ings.append(f'{rv.group(1)} {du.group(1)} {nm.group(1)}')
            steps=[m.group(1) for m in re.finditer(r'\binstructions:\s*["\']([^"\']{8,})["\']',t)]
            if add(title.group(1),ings,steps,'ForkRecipe','https://github.com/futurechef/forkrecipe-recipes/blob/main/'+str(p.relative_to('forkrecipe-recipes')),'CC-BY-SA',description=desc.group(1) if desc else None):fr_ok+=1
          stats['forkRecipeRaw']=fr_raw;stats['forkRecipeAccepted']=fr_ok

          api='https://en.wikibooks.org/w/api.php';pages=[];cats=['Category:Japanese recipes'];visited=set()
          while cats:
            cat=cats.pop(0)
            if cat in visited:continue
            visited.add(cat);cont={}
            while True:
              params={'action':'query','format':'json','list':'categorymembers','cmtitle':cat,'cmlimit':'500','cmnamespace':'0|14|102'};params.update(cont)
              data=s.get(api,params=params,timeout=30).json()
              for x in data.get('query',{}).get('categorymembers',[]):
                if int(x.get('ns',-1))==14:cats.append(x['title'])
                elif int(x.get('ns',-1)) in {0,102}:pages.append(x)
              if 'continue' not in data:break
              cont=data['continue']
          wb_raw=wb_ok=0;wb_seen=set()
          for x in pages:
            title=x.get('title');k=canon(title)
            if not title or k in wb_seen:continue
            wb_seen.add(k);wb_raw+=1
            try:data=s.get(api,params={'action':'parse','format':'json','page':title,'prop':'text'},timeout=30).json()
            except:continue
            html=data.get('parse',{}).get('text',{}).get('*','');soup=BeautifulSoup(html,'html.parser');ings=[];steps=[]
            for h in soup.find_all(['h2','h3','h4']):
              lab=h.get_text(' ',strip=True).casefold();items=[];node=h.find_next_sibling()
              while node and node.name not in ['h2','h3','h4']:
                if node.name in ['ul','ol']:items += [li.get_text(' ',strip=True) for li in node.find_all('li',recursive=False)]
                elif node.name=='p' and len(node.get_text(' ',strip=True))>20:items.append(node.get_text(' ',strip=True))
                node=node.find_next_sibling()
              if 'ingredient' in lab:ings+=items
              if any(z in lab for z in ['procedure','direction','method','preparation']):steps+=items
            # Fallback for pages where headings are rendered differently: first unordered
            # list with ingredient-like short lines and first ordered list as method.
            if len(ings)<3:
              for ul in soup.find_all('ul'):
                vals=[li.get_text(' ',strip=True) for li in ul.find_all('li',recursive=False)]
                if len(vals)>=3 and sum(len(v)<140 for v in vals)>=3:ings=vals;break
            if len(steps)<2:
              for ol in soup.find_all('ol'):
                vals=[li.get_text(' ',strip=True) for li in ol.find_all('li',recursive=False)]
                if len(vals)>=2:steps=vals;break
            if add(title.split(':')[-1],ings,steps,'Wikibooks Japanese recipes','https://en.wikibooks.org/wiki/'+title.replace(' ','_'),'CC BY-SA'):wb_ok+=1
          stats['wikibooksRaw']=wb_raw;stats['wikibooksAccepted']=wb_ok

          rows=rows[:350]
          envelope={'schemaVersion':1,'countryID':'jp','recipes':rows}
          (out/'normalized/CulinaryRecipes-jp.json').write_text(json.dumps(envelope,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          report={'countryID':'jp','minimumRequired':MIN,'acceptedDistinctProductionRows':len(rows),'sourceStats':stats,'status':'PASS' if len(rows)>=MIN else 'BELOW_200','policy':'200+ genuine licensed source-backed recipes. No synthetic dishes or fabricated quantities; unquantified source ingredients remain qualitative source text.'}
          (out/'JAPAN_PRODUCTION_AUDIT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if len(rows)<MIN:raise SystemExit(2)
          PY
          python /tmp/japan_pack.py
          (cd out && sha256sum normalized/* JAPAN_PRODUCTION_AUDIT.json > audit/SHA256SUMS.txt)

      - name: Upload Japan production pack
        uses: actions/upload-artifact@v4
        with:
          name: remnis-japan-production-build122
          path: out/
          retention-days: 7
