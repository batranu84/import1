[build-system]
requires = ["setuptools>=69,<81", "wheel<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowstrike"
version = "0.26.0"
description = "Evidence-driven security assessment orchestration platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Proprietary"}
authors = [{name = "ProArt Labs"}]
dependencies = [
  "fastapi>=0.128,<0.142",
  "uvicorn[standard]>=0.48,<0.52",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.14,<2.16",
  "httpx>=0.28,<0.29",
  "dnspython>=2.8,<2.9",
  "typer>=0.26,<0.27",
  "rich>=14,<15",
  "pypdf>=6,<7",
  "cryptography>=45,<47",
  "mac-vendor-lookup>=0.1.15,<0.2",
  "zeroconf>=0.150,<0.151"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
shadowstrike = "shadowstrike.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
